# ---------------------------------------------------------------------------
# Gateway de DESARROLLO
#
# Única URL de acceso: http://localhost:8080
#   /      -> servidor de Vite (HMR por WebSocket)
#   /api/  -> backend Flask
# ---------------------------------------------------------------------------

# Necesario para el WebSocket del HMR: sólo manda "upgrade" cuando el cliente
# lo pide, así el resto de las requests usan conexiones normales.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------- Frontend (Vite)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El HMR mantiene la conexión abierta: no cortar por inactividad.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
